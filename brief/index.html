<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iconMap - لوحة الأسئلة</title>
<style>
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:400;src:url(/f/reg.ttf)}
@font-face{font-family:"IBM Plex Sans Arabic";font-weight:700;src:url(/f/bold.ttf)}
:root{--bg:#0c0c0d;--card:#151517;--line:#2a2a2f;--tx:#f2f2f2;--mut:#a7a7ae;--or:#ff8a1e;--or2:#ffb066;--ok:#5cd08a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7}
.app{max-width:900px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 16px}
header{padding:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:20px}.brand b{color:var(--or)}
.dots{display:flex;gap:8px;direction:ltr}
.dot{width:34px;height:6px;border-radius:6px;background:#2d2d33;transition:.25s}.dot.on{background:var(--or)}.dot.past{background:var(--or2)}
.who{color:var(--or);font-weight:700;font-size:14px;margin-top:22px}
h1{font-size:clamp(24px,5vw,34px);line-height:1.3;margin:4px 0 6px;font-weight:700}
.hint{color:var(--mut);margin:0 0 18px;font-size:16px}
main{flex:1;padding-bottom:20px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 16px 14px;cursor:pointer;transition:.18s;text-align:right;color:inherit;font:inherit;display:block;width:100%}
.card:hover{border-color:#4a4a52;transform:translateY(-2px)}
.card.sel{border-color:var(--or);background:#1c1612;box-shadow:0 0 0 3px rgba(255,138,30,.18)}
.card svg{width:34px;height:34px;stroke:var(--or);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.card h3{margin:0 0 2px;font-size:18px}.card p{margin:0;color:var(--mut);font-size:14.5px}
.card .tag{display:inline-block;margin-top:8px;background:#221a12;color:var(--or2);border-radius:999px;padding:1px 10px;font-size:13px}
.big{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.big .card{padding:22px}.big svg{width:64px;height:64px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 12px}
.chip{background:var(--card);border:2px solid var(--line);color:inherit;border-radius:999px;padding:8px 18px;cursor:pointer;font:inherit;transition:.18s}
.chip.sel{border-color:var(--or);background:#1c1612}
input[type=text],textarea{width:100%;background:#101012;border:2px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 14px;font:inherit}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--or)}
h2{font-size:19px;margin:26px 0 4px}
.drop{margin-top:10px;border:2px dashed #3b3b42;border-radius:14px;padding:16px;text-align:center;color:var(--mut);cursor:pointer}
.drop.ok{border-color:var(--ok);color:var(--ok)}
footer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:18px 0 22px;display:flex;gap:12px;justify-content:space-between}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 28px;cursor:pointer;font-size:17px}
.btn.go{background:var(--or);color:#161008}.btn.go:disabled{background:#3a2c1c;color:#7b6a58;cursor:not-allowed}
.btn.back{background:#1b1b1e;color:var(--tx);border:1px solid var(--line)}
.spin{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;color:var(--mut)}
.spin i{width:26px;height:26px;border:3px solid #333;border-top-color:var(--or);border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.idea .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--or);color:#161008;font-weight:700;margin-inline-end:10px}
.done{text-align:center;padding:40px 0}
.done .ck{width:86px;height:86px;border-radius:50%;border:3px solid var(--ok);display:grid;place-items:center;margin:0 auto 14px;font-size:44px;color:var(--ok)}
.sum{margin:20px auto 0;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 18px;text-align:right}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid #222}.sum div:last-child{border:0}.sum span{color:var(--mut)}
@media(max-width:520px){.btn{padding:12px 20px}}
</style>
</head>
<body>
<div class="app">
  <header><div class="brand"><b>icon</b>Map</div><div class="dots" id="dots"></div></header>
  <main id="stage"></main>
  <footer id="foot"></footer>
</div>
<script>
const I = {
  globe:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>',
  vs:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="10" height="10" rx="2"/><rect x="11" y="4" width="10" height="10" rx="2"/></svg>',
  zones:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>',
  route:'<svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18c8 0 2-12 10-12"/></svg>',
  news:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  under:'<svg viewBox="0 0 24 24"><path d="M2 8c3-2 5 2 8 0s5-2 8 0 4 0 4 0M2 14h20M2 19h20"/></svg>',
  phone:'<svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 19h2"/></svg>',
  screen:'<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="13" rx="2"/><path d="M8 21h8M12 18v3"/></svg>',
  mic:'<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
  wave:'<svg viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>'
};
const TYPES = [
  ['1','شرح موقع','وين يقع المكان وليش هو مهم', 'globe'],
  ['2','مقارنة','دولتين أو منطقتين جنب بعض بالأرقام', 'vs'],
  ['3','مناطق وتصنيفات','مناطق زمنية، تكتلات، أقاليم بألوان', 'zones'],
  ['4','مسار ورحلة','طريق تجاري، خط طيران، هجرة', 'route'],
  ['5','خبر وسياسة بالأرقام','مخطط هيكلي، مقاعد، أعداد', 'news'],
  ['6','ما تحت السطح','مقطع عرضي: جيولوجيا، صفائح، جزر', 'under']
];
const AUD = ['عامة الناس','طلاب','أصحاب مشاريع ومهنيين','متابعين حسابي'];
const A = { type:null, size:null, audience:null, audienceOther:'', voiceMode:'free', idea:null, ownIdea:'' };
const STEPS = ['type','size','audience','idea'];
let step = 0, ideas = null, poll = null, uploaded = null, finished = false;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const post = (key, value) => fetch('/api/answer', { method:'POST', body: JSON.stringify({ key, value }) }).catch(() => {});

function dots(){ $('#dots').innerHTML = STEPS.map((_, i) => `<span class="dot ${i < step ? 'past' : i === step ? 'on' : ''}"></span>`).join(''); }
function head(q, h){ return `<div class="who">iconReem تسألك:</div><h1>${q}</h1><p class="hint">${h || ''}</p>`; }
function foot(){
  if (finished) { $('#foot').innerHTML = ''; return; }
  const ok = canNext();
  $('#foot').innerHTML = `<button class="btn back" ${step === 0 ? 'style="visibility:hidden"' : ''} onclick="back()">رجوع</button><button class="btn go" ${ok ? '' : 'disabled'} onclick="next()">${step === 3 ? 'ابدأ الفيديو' : 'التالي'}</button>`;
}
function canNext(){
  if (step === 0) return !!A.type;
  if (step === 1) return !!A.size;
  if (step === 2) return !!A.audience && (A.audience !== 'غيرهم' || A.audienceOther.trim());
  if (step === 3) return !!A.idea || A.ownIdea.trim().length > 3;
  return false;
}
function render(){
  dots();
  const s = $('#stage');
  if (finished) return done();
  if (step === 0) {
    s.innerHTML = head('شنو نوع الفيديو اللي تبيه؟','اختر نوع واحد، ويتحدد عليه شكل المشاهد.') + '<div class="grid">' + TYPES.map(t => `<button class="card ${A.type === t[0] ? 'sel' : ''}" onclick="pickType('${t[0]}')">${I[t[3]]}<h3>${t[1]}</h3><p>${t[2]}</p></button>`).join('') + '</div>';
  } else if (step === 1) {
    s.innerHTML = head('طولي ولا عرضي؟','هذا الاختيار يحدد المحرك تلقائيًا.') + '<div class="grid big">' +
      `<button class="card ${A.size === 'vertical' ? 'sel' : ''}" onclick="pickSize('vertical')">${I.phone}<h3>طولي <bdi dir="ltr">1080×1920</bdi></h3><p>ريل، ستوري، تيك توك، شورتس</p><span class="tag">محرك الكرة ثلاثي الأبعاد بصور أقمار ناسا</span></button>` +
      `<button class="card ${A.size === 'horizontal' ? 'sel' : ''}" onclick="pickSize('horizontal')">${I.screen}<h3>عرضي <bdi dir="ltr">1920×1080</bdi></h3><p>يوتيوب وعروض الشاشة</p><span class="tag">المحرك المسطح</span></button></div>`;
  } else if (step === 2) {
    s.innerHTML = head('لمن الفيديو؟','يحدد مستوى الشرح وكم جغرافيا يشرح أول.') +
      '<div class="chips">' + AUD.concat(['غيرهم']).map(a => `<button class="chip ${A.audience === a ? 'sel' : ''}" onclick="pickAud(this.dataset.a)" data-a="${esc(a)}">${a}</button>`).join('') + '</div>' +
      (A.audience === 'غيرهم' ? `<input type="text" id="other" placeholder="اكتب الجمهور" value="${esc(A.audienceOther)}" oninput="A.audienceOther=this.value;post('audienceOther',this.value);foot()">` : '') +
      '<h2>الصوت</h2><p class="hint" style="margin-bottom:10px">اختياري. لو ما اخترت، البلقن يستخدم صوت مجاني ويقول لك إن غيره أكثر طبيعية.</p><div class="grid">' +
      `<button class="card ${A.voiceMode === 'free' ? 'sel' : ''}" onclick="pickVoice('free')">${I.wave}<h3>صوت مجاني</h3><p>كويتي أو فصحى، جاهز، لكنه أقل طبيعية</p></button>` +
      `<button class="card ${A.voiceMode === 'eleven' ? 'sel' : ''}" onclick="pickVoice('eleven')">${I.mic}<h3>ElevenLabs</h3><p>صوت طبيعي من حسابك (يحتاج مفتاحك وتختار الصوت)</p></button>` +
      `<button class="card ${A.voiceMode === 'file' ? 'sel' : ''}" onclick="pickVoice('file')">${I.up}<h3>أرفع صوتي</h3><p>تسجيلك أنت، والبلقن يضبط التوقيت عليه</p></button></div>` +
      (A.voiceMode === 'file' ? `<div class="drop ${uploaded ? 'ok' : ''}" id="drop" onclick="$('#file').click()">${uploaded ? 'تم رفع: ' + esc(uploaded) : 'اسحب التسجيل هنا أو اضغط للاختيار (mp3 أو wav أو m4a)'}</div><input type="file" id="file" accept="audio/*" hidden onchange="upload(this.files[0])">` : '');
    const d = $('#drop'); if (d) { d.ondragover = e => { e.preventDefault(); }; d.ondrop = e => { e.preventDefault(); upload(e.dataTransfer.files[0]); }; }
  } else if (step === 3) {
    s.innerHTML = head('اختر فكرة الفيديو','iconReem تقترح لك 5 أفكار على حسب النوع اللي اخترته. اختر وحدة أو اكتب فكرتك.') + '<div id="ideas"></div>' +
      '<h2>أو اكتب فكرتك</h2><textarea id="own" rows="2" placeholder="مثال: ليش مضيق هرمز مهم؟ مع الدول المحيطة" oninput="A.ownIdea=this.value;A.idea=null;post(\'ownIdea\',this.value);post(\'idea\',null);paintIdeas();foot()">' + esc(A.ownIdea) + '</textarea>';
    paintIdeas(); startPoll();
  }
  foot();
}
function paintIdeas(){
  const el = $('#ideas'); if (!el) return;
  if (!ideas) { el.innerHTML = '<div class="spin"><i></i><div>iconReem تكتب لك 5 أفكار الحين...</div></div>'; return; }
  el.innerHTML = '<div class="grid">' + ideas.map((x, i) => `<button class="card idea ${A.idea === x.title ? 'sel' : ''}" onclick="pickIdea(${i})"><h3><span class="n">${i + 1}</span>${esc(x.title)}</h3><p>${esc(x.places || '')}</p>${x.why ? `<span class="tag">${esc(x.why)}</span>` : ''}</button>`).join('') + '</div>';
}
function startPoll(){ if (poll) return; const go = async () => { try { const r = await (await fetch('/api/state')).json(); if (r.ideas && r.ideas.ideas && r.ideas.ideas.length) { ideas = r.ideas.ideas; paintIdeas(); clearInterval(poll); poll = null; } } catch (e) {} }; go(); poll = setInterval(go, 1500); }
function pickType(v){ A.type = v; post('type', v); render(); }
function pickSize(v){ A.size = v; post('size', v); render(); }
function pickAud(v){ A.audience = v; post('audience', v); render(); }
function pickVoice(v){ A.voiceMode = v; post('voiceMode', v); render(); }
function pickIdea(i){ A.idea = ideas[i].title; A.ownIdea = ''; post('idea', A.idea); post('ownIdea', ''); render(); }
async function upload(f){ if (!f) return; await fetch('/api/upload?name=' + encodeURIComponent(f.name), { method:'POST', body: f }); uploaded = f.name; A.voiceMode = 'file'; render(); }
function next(){ if (!canNext()) return; if (step < 3) { step++; render(); window.scrollTo(0, 0); } else { finished = true; post('done', true); render(); } }
function back(){ if (step > 0) { step--; render(); window.scrollTo(0, 0); } }
function done(){
  const typeName = (TYPES.find(t => t[0] === A.type) || [])[1] || '', idea = A.idea || A.ownIdea;
  const rows = [['النوع', typeName], ['الفكرة', idea], ['المقاس', A.size === 'vertical' ? 'طولي \u200E1080×1920' : 'عرضي \u200E1920×1080'], ['الجمهور', A.audience === 'غيرهم' ? A.audienceOther : A.audience], ['الصوت', A.voiceMode === 'file' ? 'صوتك المرفوع' : A.voiceMode === 'eleven' ? 'ElevenLabs' : 'صوت مجاني']];
  $('#stage').innerHTML = `<div class="done"><div class="ck">✓</div><h1>وصلت إجاباتك لـiconReem</h1><p class="hint">ارجع لمحادثة كلود، بدأ يجهّز الفيديو.</p><div class="sum">${rows.map(r => `<div><span>${r[0]}</span><b>${esc(r[1])}</b></div>`).join('')}</div></div>`;
  foot(); dots();
}
render();
</script>
</body>
</html>
